[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secsig"
version = "0.1.0"
description = "SecSig — PyQt-приложение для анализа временных рядов (тензометрия и вибрации)"
authors = [{name = "You"}]
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15",
  "pyqtgraph>=0.13",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "numpy>=1.23",
  "pyarrow>=12",
]

[tool.secsig]
entrypoint = "app.app:main"